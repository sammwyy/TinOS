# GRUB2 configuration for the TinOS rescue image.
#
# The kernel is a Multiboot2 image; GRUB hands control over in 32-bit
# protected mode with an EGA text console still active.

# A short menu so the self-test entry is reachable; the normal entry boots
# automatically after three seconds.
set timeout=3
set default=0
set timeout_style=menu

# Hand the kernel a real 80x25 EGA text console: TinOS starts in text mode
# and performs the switch to a linear framebuffer itself.
set gfxpayload=text

menuentry "TinOS" {
    set gfxpayload=text
    multiboot2 /boot/tinos.elf
    module2 /boot/ramfs.tar ramfs
    boot
}

menuentry "TinOS (kernel self-test on serial)" {
    set gfxpayload=text
    multiboot2 /boot/tinos.elf selftest
    module2 /boot/ramfs.tar ramfs
    boot
}

menuentry "TinOS (text console)" {
    set gfxpayload=text
    multiboot2 /boot/tinos.elf tinos.mode=text
    module2 /boot/ramfs.tar ramfs
    boot
}
